{% extends "base.html" %}
{% block content %}
<article class="card table-card events-card">
  <div class="card-head">
    <div>
      <h2>Monitoring events</h2>
      <p>Verified decisions generated by the fatigue engine</p>
    </div>
    <div class="table-filter" role="group" aria-label="Filter monitoring events">
      <button class="active" data-filter="ALL">All</button>
      <button data-filter="WARNING">Warnings</button>
      <button data-filter="DROWSY">Drowsy</button>
    </div>
  </div>
  <div class="table-scroll">
    <table class="events-table">
      <colgroup>
        <col class="event-time-column">
        <col class="event-device-column">
        <col class="event-state-column">
        <col class="event-integrity-column">
        <col class="event-reason-column">
      </colgroup>
      <thead><tr><th>Time</th><th>Device</th><th>State</th><th>Integrity</th><th>Reason</th></tr></thead>
      <tbody id="events-body"><tr><td colspan="5" class="empty-row">No events recorded</td></tr></tbody>
    </table>
  </div>
  <footer class="table-pagination" aria-label="Event pagination">
    <span id="events-range">0 events</span>
    <nav class="pagination-controls" aria-label="Pages">
      <button id="events-prev" class="page-arrow" type="button" aria-label="Previous page">&#8249;</button>
      <div id="events-pages" class="page-numbers"></div>
      <button id="events-next" class="page-arrow" type="button" aria-label="Next page">&#8250;</button>
    </nav>
  </footer>
</article>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='events.js') }}"></script>{% endblock %}
