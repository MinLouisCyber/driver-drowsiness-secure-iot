[project]
name = "driver-drowsiness-secure-iot"
version = "0.1.0"
description = "USB-camera drowsiness monitor with signed, replay-protected events"
requires-python = ">=3.10,<3.13"
dependencies = [
  "Flask>=3.0,<4",
  "mediapipe>=0.10.21,<0.11",
  "numpy>=1.26,<2",
  "opencv-python>=4.10,<5",
  "paho-mqtt>=2.1,<3",
  "amqtt>=0.12,<0.13",
]

[project.scripts]
driver-monitor = "driver_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["driver_monitor"]
